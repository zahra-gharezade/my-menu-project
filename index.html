<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *,
      *::before,
      *::after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: gray;
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      }
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
      }
      h1 {
        font-size: 38px;
        color: rgb(228, 225, 225);
        margin: 50px;
        text-align: center;
      }
      .navbar {
        width: 100%;
        height: 80px;
        /* border: 2px solid red; */
        /* background-color: rgb(27, 26, 26); */
        display: flex;
        justify-content: center;

        > ul {
          width: 85%;
          height: 100%;
          background-color: rgb(53, 59, 57);
          /* border: 1px solid gold; */
          display: flex;

          > li {
            position: relative;
            /* border: 1px solid rgba(243, 242, 239, 0.267); */
            &:hover{
                >.dropmenu{
                    display: block;
                }
            }
            &:first-of-type {
              > a {
                background-color: rgba(255, 255, 255, 0.767);
                color: rgb(26, 25, 25);
              }
            }

            > a {
              /* background-color: aquamarine; */
              display: flex;
              align-items: center;
              height: 100%;
              color: rgb(247, 242, 242);
              text-transform: capitalize;
              padding: 30px;
              transition: 0.4s;

              &:hover {
                background-color: rgba(255, 255, 255, 0.767);
                color: rgb(26, 25, 25);
              }
            }
            > .dropmenu {
              background-color: rgb(46, 42, 42);             
              width: 200px;            
              left: 0; top: 80px;             
              position: absolute;
              display: none;
              >li{
                height: 50px;
                >a{
                    /* background-color: azure; */
                    width: 100%;
                    height: 100%;
                    display: flex;
                    align-items: center;
                    padding-left: 20px;
                    color: rgb(241, 235, 235);
                    text-transform: capitalize;
                    &:hover{
                         background-color: rgba(255, 255, 255, 0.767);
                         color: rgb(26, 25, 25);
                    }
                }
              }
            }
          }
        }
      }
      div{
         /* background-color: rgb(73, 66, 66); */
        width: 85%;
        height: 400px;
        /* border: 2px solid goldenrod; */
        display: flex;
        justify-content: center;
        gap: 50px;
        margin: 100px auto;
        
      >.box{
        /* border: 1px solid fuchsia; */
        background-color: rgb(58, 55, 55);
        display: flex;
        align-items: center;
         /* background-color: rgb(56, 52, 52); */      
        width: 400px;
        height: 400px;
      }
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum dolor sit amet</h1>
    <nav class="navbar">
      <ul>
        <li><a href="">home</a></li>
        <li><a href=""> aboutme</a></li>
        <li>
          <a href="">imges</a>
          <ul class="dropmenu">
            <li><a href="">submenu</a></li>
            <li><a href="">submenu</a></li>
            <li><a href="">submenu</a></li>
          </ul>
        </li>
        <li><a href="">news</a></li>
        <li><a href="">contactUs</a>
             <ul class="dropmenu">
            <li><a href="">submenu</a></li>
            <li><a href="">submenu</a></li>
            <li><a href="">submenu</a></li>
            <li><a href="">submenu</a></li>
            <li><a href="">submenu</a></li>
          </ul>
        </li>
      </ul>
    </nav>
   <div>
   <section class="box"></section>
   <section class="box"></section>
   <section class="box"></section>
   <section class="box"></section>
   </div>
  </body>
</html>
